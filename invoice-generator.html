<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Free Freelancer Invoice Generator</title>
<meta name="description" content="Free browser invoice generator for freelancers. Print to PDF. No signup."/>
<link rel="canonical" href="https://darweesh128-cmd.github.io/client-close-kit/invoice-generator.html"/>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:0 auto;padding:1.2rem;background:#f8fafc;color:#0f172a}
.sheet{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.2rem}
label{display:block;font-size:.78rem;color:#64748b;margin:.5rem 0 .15rem}
input,textarea{width:100%;padding:.5rem;border:1px solid #e2e8f0;border-radius:8px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:1rem} th,td{border-bottom:1px solid #e2e8f0;padding:.4rem;text-align:left}
.toolbar{margin:1rem 0;display:flex;gap:.5rem;flex-wrap:wrap}
button{padding:.7rem 1rem;border:0;border-radius:8px;font-weight:700;background:#0f766e;color:#fff;cursor:pointer}
.ghost{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.banner{margin:1rem 0;padding:.8rem;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px}
@media print{.noprint{display:none!important}.sheet{border:0}}
</style></head><body>
<div class="noprint">
<h1>Free freelancer invoice generator</h1>
<p>Runs in your browser. Print then Save as PDF. No signup.</p>
<div class="toolbar">
<button type="button" onclick="window.print()">Print / Save PDF</button>
<button class="ghost" type="button" onclick="addRow()">Add line item</button>
</div>
<div class="banner">Full bilingual WhatsApp pack: see <a href="./">Client Close Kit</a> home page.</div>
</div>
<div class="sheet">
<label>From</label><input id="fromName" value="Your Name / Studio"/>
<label>Bill to</label><input id="toName" value="Client name"/>
<label>Invoice #</label><input id="invNo" value="INV-001"/>
<label>Date</label><input id="invDate" type="date"/>
<label>Currency</label><input id="currency" value="USD"/>
<table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table>
<p><strong>Total: <span id="curLabel">USD</span> <span id="total">0.00</span></strong></p>
<label>Notes</label><textarea id="notes" rows="3">Payment due within 7 days.</textarea>
</div>
<script>
const rowsEl=document.getElementById("rows");
document.getElementById("invDate").valueAsDate=new Date();
function money(n){return (Math.round(n*100)/100).toFixed(2)}
function recalc(){let t=0;[...rowsEl.querySelectorAll("tr")].forEach(tr=>{const q=+tr.querySelector(".q").value||0;const r=+tr.querySelector(".r").value||0;const a=q*r;tr.querySelector(".a").textContent=money(a);t+=a;});document.getElementById("total").textContent=money(t);document.getElementById("curLabel").textContent=document.getElementById("currency").value||"USD";}
function addRow(desc="Service",q=1,r=100){const tr=document.createElement("tr");tr.innerHTML="<td><input class=d value=""+desc+""/></td><td><input class=q type=number value=""+q+"" style="width:4.5rem"/></td><td><input class=r type=number step=0.01 value=""+r+"" style="width:6rem"/></td><td class=a>0.00</td>";tr.querySelectorAll("input").forEach(i=>i.addEventListener("input",recalc));rowsEl.appendChild(tr);recalc();}
document.getElementById("currency").addEventListener("input",recalc);
addRow("Design / development work",1,250);addRow("Revisions package",1,50);
</script>
</body></html>
